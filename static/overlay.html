<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VTuber OBS Overlay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    #stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #live2d-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #speech-bubble {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 85%;
      min-width: 280px;
      background: rgba(12, 12, 22, 0.9);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(139, 92, 246, 0.5);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.65), 0 0 24px rgba(139, 92, 246, 0.3);
      border-radius: 18px;
      padding: 14px 22px;
      color: #fff;
      font-size: 1.05rem;
      line-height: 1.45;
      text-align: center;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 100;
      animation: overlayBubblePopIn 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    #speech-bubble::before {
      content: "";
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-bottom: 9px solid rgba(139, 92, 246, 0.5);
    }
    #speech-bubble.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(16px) scale(0.92);
      pointer-events: none;
      animation: none;
    }
    #speech-bubble.speaking {
      animation: overlayBubbleSpeaking 2.4s infinite ease-in-out;
      border-color: rgba(196, 181, 253, 0.85);
    }
    @keyframes overlayBubblePopIn {
      0% {
        opacity: 0;
        transform: translateX(-50%) translateY(16px) scale(0.92);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
      }
    }
    @keyframes overlayBubbleSpeaking {
      0%, 100% {
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.65), 0 0 20px rgba(139, 92, 246, 0.3);
        border-color: rgba(139, 92, 246, 0.5);
      }
      50% {
        box-shadow: 0 14px 42px rgba(0, 0, 0, 0.75), 0 0 32px rgba(167, 139, 250, 0.6);
        border-color: rgba(196, 181, 253, 0.9);
      }
    }
    .bubble-speaker {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #a78bfa;
      margin-bottom: 4px;
    }
    .bubble-text {
      white-space: pre-line;
    }
    .bubble-jp {
      display: block;
      font-size: 1.15rem;
      font-weight: 600;
    }
    .bubble-romaji {
      display: block;
      font-size: 0.85rem;
      color: #c4b5fd;
      font-style: italic;
      margin-top: 3px;
      opacity: 0.95;
    }
  </style>

  <!-- Live2D & Pixi.js local dependencies -->
  <script src="/static/libs/live2dcubismcore.min.js"></script>
  <script src="/static/libs/live2d.min.js"></script>
  <script src="/static/libs/pixi.min.js"></script>
  <script src="/static/libs/cubism4.min.js"></script>
</head>
<body>
  <div id="stage">
    <canvas id="live2d-canvas"></canvas>
    <div id="speech-bubble" class="hidden">
      <div id="bubble-speaker" class="bubble-speaker">Ryza</div>
      <div id="bubble-text" class="bubble-text">...</div>
    </div>
  </div>

  <script>
    let pixiApp = null;
    let currentModel = null;
    let ws = null;
    let bubbleTimeout = null;
    const audioQueue = [];
    let isPlayingAudio = false;
    let mouthInterval = null;

    async function initOverlay() {
      const canvas = document.getElementById("live2d-canvas");
      pixiApp = new PIXI.Application({
        view: canvas,
        autoStart: true,
        resizeTo: window,
        backgroundAlpha: 0,
      });

      window.addEventListener("resize", () => {
        if (currentModel) {
          currentModel.x = pixiApp.renderer.width / 2;
          currentModel.y = pixiApp.renderer.height * 0.55;
        }
      });

      try {
        const res = await fetch("/api/config");
        const cfg = await res.json();
        const modelKey = cfg.default_model || "mao_pro";
        const modelInfo = cfg.models[modelKey];

        currentModel = await PIXI.live2d.Live2DModel.from(modelInfo.path, { autoInteract: true });
        pixiApp.stage.addChild(currentModel);

        currentModel.scale.set(modelInfo.scale || 0.35);
        currentModel.anchor.set(0.5, 0.5);
        currentModel.x = pixiApp.renderer.width / 2;
        currentModel.y = pixiApp.renderer.height * 0.55;

        connectWS();
      } catch (err) {
        console.error("Overlay load error:", err);
      }
    }

    function connectWS() {
      const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${proto}//${window.location.host}/ws`);

      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.type === "audio") {
          if (data.clean_text) showBubble(data);
          if (data.expression_index !== null && currentModel) {
            try { currentModel.expression(data.expression_index); } catch(ex){}
          }
          if (data.audio) enqueueAudio(data.audio, data.volumes || []);
        } else if (data.type === "text") {
          if (data.clean_text) showBubble(data);
        }
      };

      ws.onclose = () => setTimeout(connectWS, 3000);
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function showBubble(item) {
      const bubble = document.getElementById("speech-bubble");
      const bText = document.getElementById("bubble-text");
      function cleanText(s) {
        if (!s) return "";
        return String(s).replace(/\[mood:\s*[^\]]+\]/gi, "").replace(/\[[a-zA-Z0-9_\-]+\]/g, "").replace(/\s+/g, " ").trim();
      }
      if (item && item.romaji && item.clean_text) {
        bText.innerHTML = `<span class="bubble-jp">${escapeHtml(cleanText(item.clean_text))}</span><span class="bubble-romaji">${escapeHtml(cleanText(item.romaji))}</span>`;
      } else if (item && item.display_text) {
        bText.textContent = cleanText(item.display_text);
      } else if (typeof item === "string") {
        bText.textContent = cleanText(item);
      } else {
        bText.textContent = cleanText((item && (item.clean_text || item.text)) || "");
      }
      bubble.classList.remove("hidden");

      if (bubbleTimeout) clearTimeout(bubbleTimeout);
      bubbleTimeout = setTimeout(() => bubble.classList.add("hidden"), 6000);
    }

    function enqueueAudio(audioB64, volumes) {
      audioQueue.push({ audioB64, volumes });
      if (!isPlayingAudio) playNextAudio();
    }

    function playNextAudio() {
      const bubble = document.getElementById("speech-bubble");
      if (audioQueue.length === 0) {
        isPlayingAudio = false;
        if (bubble) bubble.classList.remove("speaking");
        return;
      }
      isPlayingAudio = true;
      if (bubble) bubble.classList.add("speaking");
      const { audioB64, volumes } = audioQueue.shift();
      const audio = new Audio("data:audio/mp3;base64," + audioB64);

      audio.onplay = () => syncMouth(volumes);
      audio.onended = () => {
        stopMouth();
        playNextAudio();
      };
      audio.onerror = () => {
        if (bubble) bubble.classList.remove("speaking");
        stopMouth();
        playNextAudio();
      };
      audio.play().catch(() => {
        if (bubble) bubble.classList.remove("speaking");
        playNextAudio();
      });
    }

    function syncMouth(volumes) {
      stopMouth();
      let index = 0;
      mouthInterval = setInterval(() => {
        if (!currentModel || !currentModel.internalModel) return;
        if (index >= volumes.length) {
          stopMouth();
          return;
        }
        const vol = volumes[index];
        try {
          if (currentModel.internalModel.coreModel) {
            currentModel.internalModel.coreModel.setParameterValueById("ParamMouthOpenY", vol);
          }
        } catch(e){}
        index++;
      }, 20);
    }

    function stopMouth() {
      if (mouthInterval) clearInterval(mouthInterval);
      mouthInterval = null;
      if (currentModel && currentModel.internalModel && currentModel.internalModel.coreModel) {
        try {
          currentModel.internalModel.coreModel.setParameterValueById("ParamMouthOpenY", 0);
        } catch(e){}
      }
    }

    window.addEventListener("DOMContentLoaded", initOverlay);
  </script>
</body>
</html>
