<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Companion - Live2D</title>
  <link rel="stylesheet" href="/static/style.css">
  
  <!-- Live2D & Pixi.js local dependencies -->
  <script src="/static/libs/live2dcubismcore.min.js"></script>
  <script src="/static/libs/live2d.min.js"></script>
  <script src="/static/libs/pixi.min.js"></script>
  <script src="/static/libs/cubism4.min.js"></script>
</head>
<body>
  <div id="app-container">
    <!-- Header / Top Bar -->
    <header id="control-bar">
      <div class="brand">
        <span class="brand-badge">LIVE</span>
        <h1>AI Companion</h1>
      </div>
      
      <div class="controls">
        <button id="camera-toggle-btn" class="icon-btn" title="Toggle Kamera Vision">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          <span class="btn-text">Kamera</span>
        </button>

        <button id="screen-toggle-btn" class="icon-btn" title="Bagikan Layar (Screen Vision / Co-Pilot)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          <span class="btn-text">Layar</span>
        </button>

        <a href="/settings" class="icon-btn settings-link" title="Buka Pengaturan Lengkap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span class="btn-text">Settings</span>
        </a>

        <button id="lang-quick-btn" class="pill" style="background: rgba(56, 189, 248, 0.18); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.4); cursor: pointer; display: flex; align-items: center; gap: 4px;" title="Klik untuk Ganti Bahasa Respon Cepat (Jepang / Indo / Inggris / Auto)">
          <span id="lang-quick-icon">🇯🇵</span> <span id="lang-quick-text">JA</span>
        </button>

        <div id="mood-pill" class="pill mood-badge" title="Status Perasaan AI Saat Ini">
          <span id="mood-icon">💖</span> <span id="mood-text">Mood: Ceria</span>
        </div>

        <div id="tts-pill" class="pill" style="background: rgba(139, 92, 246, 0.2); color: #c4b5fd; font-size: 0.75rem; border: 1px solid rgba(139, 92, 246, 0.3);" title="Engine TTS Aktif">TTS: VOICEVOX</div>

        <div id="status-pill" class="pill status-offline">Offline</div>
      </div>
    </header>

    <!-- Main Stage for Live2D Canvas -->
    <main id="stage">
      <canvas id="live2d-canvas"></canvas>

      <!-- Model Transform Control (Floating Zoom / Pan Controls) -->
      <div id="stage-controls">
        <button id="zoom-in-btn" class="tool-btn" title="Zoom In">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="11" y1="8" x2="11" y2="14"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </button>
        <button id="zoom-out-btn" class="tool-btn" title="Zoom Out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </button>
        <button id="reset-pos-btn" class="tool-btn" title="Reset Posisi & Zoom">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
        </button>
      </div>

      <!-- Floating Subtitles / Speech Bubble -->
      <div id="speech-bubble" class="speech-bubble hidden">
        <div id="bubble-speaker" class="bubble-speaker">Ryza</div>
        <div id="bubble-text" class="bubble-text">...</div>
      </div>

      <!-- Draggable Camera Video Preview -->
      <div id="camera-preview-box" class="camera-box hidden">
        <div class="camera-header">
          <span>Vision Camera</span>
          <button id="camera-close-btn">&times;</button>
        </div>
        <video id="camera-video" autoplay playsinline muted></video>
        <div class="camera-tag">Active on Chat</div>
      </div>

      <!-- Draggable Screen Video Preview -->
      <div id="screen-preview-box" class="camera-box hidden" style="bottom: 90px; right: 280px;">
        <div class="camera-header">
          <span>Screen Vision (Co-Pilot)</span>
          <button id="screen-close-btn">&times;</button>
        </div>
        <video id="screen-video" autoplay playsinline muted></video>
        <div class="camera-tag">Active on Chat</div>
      </div>
    </main>

    <!-- Bottom Input Bar -->
    <footer id="input-container">
      <div class="input-card">
        <button id="mic-btn" class="action-btn mic-btn" title="Bicara Manual (Voice Input)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>
        <button id="vad-btn" class="action-btn" title="Mode Bicara Otomatis Tanpa Tangan (Hands-Free VAD Mode)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </button>
        <input 
          type="text" 
          id="chat-input" 
          placeholder="Ketik pesan atau bicara... (Klik kepala avatar untuk headpat, pipi untuk poke!)" 
          autocomplete="off"
        />
        <button id="send-btn" class="action-btn send-btn" title="Kirim">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
